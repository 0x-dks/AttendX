<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AttendX — Teacher login</title>
  <meta name="description" content="Teacher login for AttendX attendance management system.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 32px 28px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .login-card h1 {
      text-align: center;
      margin-bottom: -4px;
    }
    .login-card .subtitle {
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-sec);
    }
    .login-card label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-sec);
      margin-bottom: 4px;
      display: block;
    }
    .login-card .btn-primary {
      width: 100%;
      justify-content: center;
      padding: 11px;
      font-size: 0.875rem;
    }
    .back-link {
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-sec);
      text-decoration: none;
    }
    .back-link:hover { color: var(--ink); }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Logo icon (inline SVG — shield) -->
    <div style="text-align: center;">
      <span class="icon" style="width: 32px; height: 32px; color: var(--ink);">
        <svg viewBox="0 0 24 24"><path d="M12 2l7 4v5c0 5-3 9.5-7 10.5C8 20.5 5 16 5 11V6l7-4z"/></svg>
      </span>
    </div>

    <h1>Teacher login</h1>
    <p class="subtitle">Enter your passkey to view the attendance dashboard</p>

    {% if error %}
      <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post" style="display: flex; flex-direction: column; gap: 12px;">
      <div>
        <label for="password">Passkey</label>
        <input type="password" id="password" name="password" placeholder="Enter teacher password" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary">Sign in to dashboard</button>
    </form>

    <a href="/" class="back-link">Back to scanner</a>
  </div>

</body>
</html>
